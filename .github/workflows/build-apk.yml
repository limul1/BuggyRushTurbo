name: Build Buggy Rush APK

on:
  push:
    paths:
      - 'BuggyRush_APK_Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q BuggyRush_APK_Project.zip -d extracted
          test -f extracted/BuggyRush_APK_Project/settings.gradle

      - name: Build debug APK
        run: gradle --no-daemon -p extracted/BuggyRush_APK_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buggy-Rush-APK
          path: extracted/BuggyRush_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
