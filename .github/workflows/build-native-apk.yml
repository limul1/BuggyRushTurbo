name: Build native C++ APK
on:
  push:
    branches: [main]
    paths:
      - 'BuggyRush_CPP.zip'
      - 'BuggyRush_Android_Build_Package.zip'
      - 'README.md'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android tools
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract native project
        run: |
          if [ -f BuggyRush_CPP.zip ]; then
            unzip -o BuggyRush_CPP.zip
          else
            unzip -o BuggyRush_Android_Build_Package.zip
          fi
          if [ -d BuggyRush_CPP/BuggyRush_CPP ]; then
            mv BuggyRush_CPP/BuggyRush_CPP ./native-project
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/native-project" >> $GITHUB_ENV
          elif [ -d BuggyRush_CPP ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/BuggyRush_CPP" >> $GITHUB_ENV
          else
            echo "Native project folder not found after extraction"; find . -maxdepth 3 -type f; exit 1
          fi
      - name: Fix Android SDK compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('.').glob('**/app/build.gradle')) + list(Path('.').glob('**/app/build.gradle.kts'))
          if not files:
              raise SystemExit('app/build.gradle not found')
          for p in files:
              s = p.read_text()
              # Android 10 is API 29: keep minimum SDK installable there and target a modern-enough API.
              s, nmin = re.subn(r'((?:minSdkVersion|minSdk)\\s*(?:=)?\\s*)\\d+', r'\\g<1>23', s)
              s, ntarget = re.subn(r'((?:targetSdkVersion|targetSdk)\\s*(?:=)?\\s*)\\d+', r'\\g<1>29', s)
              p.write_text(s)
              print(f'{p}: minSdk replacements={nmin}, targetSdk replacements={ntarget}')
              print(''.join(line for line in s.splitlines(True) if 'Sdk' in line or 'sdk' in line))
          PY
      - name: Patch C++ compatibility errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BuggyRush_CPP/src/main.cpp")
          if not p.exists():
              p = Path("native-project/src/main.cpp")
          if not p.exists():
              p = Path("BuggyRush_CPP/BuggyRush_CPP/src/main.cpp")
          s = p.read_text()
          s = s.replace("constexpr float PI=3.14159265358979323846f;", "constexpr float GAME_PI=3.14159265358979323846f;")
          s = s.replace("DrawRectangleRoundedLines(r,.28f,8,2,WHITE);", "DrawRectangleLinesEx(r,2.0f,WHITE);")
          old = 'drawButton({18,sh-112,78,78},"<",DARKBLUE);drawButton({106,sh-112,78,78},">",DARKBLUE);drawButton({sw-112,sh-112,94,78},"GAZ",DARKGREEN);drawButton({sw-220,sh-105,88,65},"TURBO",ORANGE);drawButton({sw-112,sh-202,94,70},"FREIN",MAROON);'
          new = 'drawButton(Rectangle{18.0f,(float)(sh-112),78.0f,78.0f},"<",DARKBLUE);drawButton(Rectangle{106.0f,(float)(sh-112),78.0f,78.0f},">",DARKBLUE);drawButton(Rectangle{(float)(sw-112),(float)(sh-112),94.0f,78.0f},"GAZ",DARKGREEN);drawButton(Rectangle{(float)(sw-220),(float)(sh-105),88.0f,65.0f},"TURBO",ORANGE);drawButton(Rectangle{(float)(sw-112),(float)(sh-202),94.0f,70.0f},"FREIN",MAROON);'
          if old not in s:
              raise SystemExit("Touch-control line not found; source differs from expected version")
          s = s.replace(old, new)
          p.write_text(s)
          print("Patched:", p)
          PY
      - name: Inspect C++ source
        run: |
          echo "=== patched source ==="
          sed -n '1,15p;48,52p;124,128p' "$PROJECT_DIR/src/main.cpp"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuggyRush-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: warn
