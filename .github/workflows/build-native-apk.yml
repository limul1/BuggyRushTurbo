name: Build native C++ APK
on:
  push:
    branches: [main]
    paths:
      - 'BuggyRush_CPP.zip'
      - 'BuggyRush_Android_Build_Package.zip'
      - 'README.md'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android tools
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract native project
        run: |
          if [ -f BuggyRush_CPP.zip ]; then
            unzip -o BuggyRush_CPP.zip
          else
            unzip -o BuggyRush_Android_Build_Package.zip
          fi
          if [ -d BuggyRush_CPP/BuggyRush_CPP ]; then
            mv BuggyRush_CPP/BuggyRush_CPP ./native-project
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/native-project" >> $GITHUB_ENV
          elif [ -d BuggyRush_CPP ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/BuggyRush_CPP" >> $GITHUB_ENV
          else
            echo "Native project folder not found after extraction"; find . -maxdepth 3 -type f; exit 1
          fi
      - name: Inspect C++ source
        run: |
          echo "=== main.cpp lines 1-145 ==="
          nl -ba "$PROJECT_DIR/src/main.cpp" | sed -n '1,145p'
          echo "=== Raylib declaration ==="
          grep -R "DrawRectangleRoundedLines" "$ANDROID_HOME" 2>/dev/null | head -5 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuggyRush-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: warn
