name: Build native C++ APK
on:
  push:
    branches: [main]
    paths:
      - 'BuggyRush_CPP_Natif_Prototype.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android tools
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract native project
        run: |
          unzip -o BuggyRush_CPP_Natif_Prototype.zip
          cd BuggyRush_CPP
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/BuggyRush_CPP" >> $GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuggyRush-debug-apk
          path: BuggyRush_CPP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
